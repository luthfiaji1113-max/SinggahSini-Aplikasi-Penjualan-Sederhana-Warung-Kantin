<!DOCTYPE html>
<html>
<head>
    <title>table</title>
</head>
<body>
    <h3>daftar barang</h3>
<table border="1" align="center" cellpadding="10" cellpadding="0">
    <tr> <!-- baris pertama-->
        <th>kode produk</th>
        <th>nama produk</th>
        <th>harga</th>
    </tr>
    <tr> <!-- baris kedua-->
        <td>P001</td>
        <td>kipas angin</td>
        <td>400.000</td>
    </tr>
       <tr> <!-- baris ketiga-->
        <td>P002</td>
        <td>lemari es</td>
        <td>1700.000</td>
    </tr>
    <tr> <!-- baris keempat-->
        <td>P003</td>
        <td>mesin cuci</td>
        <td>2000.000</td>
    </tr>
</table>
</body>
</html>
