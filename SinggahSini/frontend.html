<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SinggahSini</title>
  <!-- Bootstrap 6.0.0-alpha.1 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Kedai SinggahSini -->
  <header class="app-header px-5 py-3" data-bs-theme="dark">
    <div class="d-flex align-items-center gap-3">
      <!-- Logo SinggahSini -->
      <img src="pblsinggahsini.jpg.jpg" alt="Logo SinggahSini" class="logo" onclick="go('menu')" onerror="this.src='pblsinggahsini.jpeg'">
      <span class="brand fs-2xl fw-bold" onclick="go('menu')">SinggahSini</span>
    </div>
    
    <!-- Search Bar di Tengah -->
    <div class="search-container">
      <form class="search-wrapper" onsubmit="return false">
        <div class="input-group">
          <input id="q" class="form-control" placeholder="Cari menu, misal: nasi goreng, es teh..." oninput="cari(this.value)">
          <button class="btn" type="button" aria-label="Cari"><i class="bi bi-search"></i></button>
        </div>
      </form>
    </div>

    <!-- Tombol Keranjang & Ikon Buku (Membuka Riwayat Penjualan) -->
    <div class="d-flex align-items-center gap-4 ms-auto">
      <button class="btn-text position-relative fs-3xl p-0" aria-label="Keranjang" onclick="go('keranjang')">
        <i class="bi bi-cart"></i><span id="badge" class="badge badge-cart rounded-pill position-absolute top-0 start-100 translate-middle">0</span>
      </button>
      <button class="btn-text fs-3xl p-0" aria-label="Riwayat Penjualan" onclick="bukaRiwayat()" title="Riwayat Penjualan">
        <i class="bi bi-journal-bookmark-fill"></i>
      </button>
    </div>
  </header>

  <!-- Navigasi (Menu, Kasir, Riwayat Transaksi) -->
  <nav class="bg-2" data-bs-theme="dark">
    <ul id="nav" class="nav flex-wrap justify-content-center gap-7 py-1"></ul>
  </nav>

  <!-- Container Konten Dinamis -->
  <div id="modal"></div>
  <main id="view" class="container py-7"></main>

  <!-- Toast Notification -->
  <div class="toast-container">
    <div id="toast" class="toast text-white" style="background-color: var(--dark-brown)" role="status">
      <div class="toast-body"></div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="app.js"></script>
</body>
</html>
