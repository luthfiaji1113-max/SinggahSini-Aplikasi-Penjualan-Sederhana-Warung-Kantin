<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulir dengan css eksternal</title>
    <link rel="stylesheet" href="style3.css"> <!-- menghubung file css eksternal -->
</head>
<body>
    <h2 style="text-align: center;">formulir pendaftaran</h2>
    <form action="#" method="post">  
        <label for="nama">nama lengkap:</label>
        <input type="text" id="nama" name="nama"  placeholder="masukkan nama lengkap anda" required>

        <label for="email">email:</label>
        <input type="email" id="email" name="email"  placeholder="masukkan email anda" required>

        <label for="password">password:</label>
        <input type="password" id="password" name="password"  placeholder="masukkan password" required>

        <label for="alamat">alamat:</label>
        <textarea id="alamat" name="alamat"  rows="4" placeholder="masukkan alamat lengkap anda"></textarea>

        <label for="no hp">no hp</label>
        <input type="no hp" id="no hp" name="no hp"  placeholder="masukkan no hp" required>

        <label>
            <input type="checkbox" name="terms" required> Saya setuju dengan syarat dan ketentuan
        </label>

        <button type="submit">daftar</button>
    </from>
</body>
</html>
