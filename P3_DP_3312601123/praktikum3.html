<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulir dengan css eksternal</title>
    <link rel="stylesheet" href="style4.css?v=2"> <!-- menghubung file css eksternal -->
</head>
<body>
    <form action="#" method="post">
        <img src="foto pbl.jpg" width="150" height="150" style="display: block; margin: 0 auto;">

         <h2 style="text-align: center;">Login administrasi</h2>
        
    
        <label for="nama">Username</label>
        <input type="text" id="nama" name="nama"  placeholder="Username" required>

        <label for="email">email:</label>
        <input type="email" id="email" name="email"  placeholder="masukkan email anda" required>

        <label for="password">password</label>
        <input type="password" id="password" name="password"  placeholder="masukkan password" required>

        
        <label for="no hp">no hp</label>
        <input type="tel" id="no hp" name="no hp"  placeholder="masukkan no hp" required>
        <button type="submit">login</button>
    </form>
</body>
</html>
