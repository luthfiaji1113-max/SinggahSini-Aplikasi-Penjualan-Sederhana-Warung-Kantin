<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulir dengan css eksternal</title>
    <link rel="stylesheet" href="style4.css"> <!-- menghubung file css eksternal -->
</head>
<body>
    <h2 style="text-align: center;">Login administrasi</h2>
    <from action="#" method="post">
        <img src="foto pbl.jpg" width="150" height="150" style="display: block; margin: 0 auto;">
        
    
        <label for="nama">nama lengkap</label>
        <input type="text" id="nama" name="nama" style="width: 100%;" placeholder="masukkan nama lengkap anda" required>

        <label for="email">email:</label>
        <input type="email" id="email" name="email" style="width: 100%;" placeholder="masukkan email anda" required>

        <label for="password">password</label>
        <input type="password" id="password" name="password" style="width: 100%;" placeholder="masukkan password" required>

        <label for="alamat">alamat</label>
        <textarea id="alamat" name="alamat" style="width: 100%;" rows="4" placeholder="masukkan alamat lengkap anda"></textarea>

        <label for="no hp">no hp</label>
        <input type="no hp" id="no hp" name="no hp" style="width: 100%;" placeholder="masukkan no hp" required>

        <label>
            <input type="checkbox" name="terms" required> Saya setuju dengan syarat dan ketentuan
        </label>

        <button type="submit">login</button>
    </from>
</body>
</html>
