<!DOCTYPE html>
<html>
<head>
    <title>Validasi Formulir</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="form-container">
        <h2 >pendaftaran</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="nama" placeholder="Masukkan nama">
                <div class="error-message" id="nameError">Nama tidak boleh kososng</div>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email">
                <div class="error-message" id="emailError">Masuukan alamat email yang valid</div>
            </div>
            <div class="form-group">
                <label for="password">Kata sandi:</label>
                <input type="password" id="password" name="password" placeholder="Masukkan kata sandi">
                <div class="error-message" id="passwordError">Kata sandi harus minimal 6 karakter</div>
            </div>
            <button type="submit" class="submit-btn">Daftar</button>
        </form>
    </div>
     <script src="script1.js"></script>
</body>
</html>
